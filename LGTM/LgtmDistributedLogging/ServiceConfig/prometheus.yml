# my global config
global:
  scrape_interval: 15s 
  evaluation_interval: 15s 

# REMOVE the remote_write_receiver: enabled: true block entirely

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"

otlp:
  promote_resource_attributes:
    - service.name
    - service.instance.id